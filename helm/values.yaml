# One process and one persistent volume per instance. Use separate releases,
# credentials, volumes, and container boundaries for unrelated tenants.
replicaCount: 1
image:
  repository: "" # Required: build/push your image, or use a published Fathom image.
  tag: "" # Required: an immutable tag is recommended.
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8790
mode: personal
config:
  llm:
    provider: ollama
    model: llama3.2
    baseUrl: http://ollama:11434
policy:
  version: 1
  defaults:
    network: deny
    filesystem: read-only
    shell: deny
    secrets: isolated
  rules: []
# Optional Secret containing a complete config.yaml, for OIDC client secrets.
configSecret: ""
# Optional Secret containing provider credential environment variables.
credentialsSecret: ""
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
