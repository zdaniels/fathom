{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Fathom requires replicaCount=1 per instance" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fathom
  labels:
    app: fathom
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fathom
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: fathom
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: fathom
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret | quote }}
          {{- end }}
          env:
            - name: FATHOM_CONFIG
              value: /etc/fathom/config/config.yaml
            - name: FATHOM_POLICY
              value: /etc/fathom/policy/policy.yaml
            - name: FATHOM_HOST
              value: "0.0.0.0"
            - name: FATHOM_PORT
              value: "{{ .Values.service.port }}"
            - name: FATHOM_DATA_DIR
              value: "/data"
            - name: FATHOM_MODE
              value: "{{ .Values.mode }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- range .Values.securityContext.capabilities.drop }}
                - {{ . }}
                {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/fathom/config
              readOnly: true
            - name: policy
              mountPath: /etc/fathom/policy
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
        - name: config
          {{- if .Values.configSecret }}
          secret:
            secretName: {{ .Values.configSecret | quote }}
          {{- else }}
          configMap:
            name: {{ .Release.Name }}-fathom-config
          {{- end }}
        - name: policy
          configMap:
            name: {{ .Release.Name }}-fathom-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-fathom-data
          {{- else }}
          emptyDir: {}
          {{- end }}
