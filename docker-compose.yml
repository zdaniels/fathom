services:
  fathom:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fathom-data:/data
      - ./deploy/container.config.yaml:/etc/fathom/config.yaml:ro
      - ./deploy/container.policy.yaml:/etc/fathom/policy.yaml:ro
    # For hosted models: add an env_file or individual environment entries.
    # Do not mount the host Docker socket or host home into the agent container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=100m
volumes:
  fathom-data:
