name: calendar
version: "1.0.0"
author: fathom-team
signature: ed25519:builtin
description: Manage Google Calendar events - list, create, update, and set reminders
category: productivity
tags:
  - calendar
  - google
  - events
  - scheduling
permissions:
  network:
    - GET https://www.googleapis.com/calendar/*
    - POST https://www.googleapis.com/calendar/*
    - PUT https://www.googleapis.com/calendar/*
    - PATCH https://www.googleapis.com/calendar/*
    - DELETE https://www.googleapis.com/calendar/*
    - POST https://oauth2.googleapis.com/*
  filesystem: none
  shell: none
  memory: own
  secrets:
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_REFRESH_TOKEN
tools:
  - name: list_events
    function: listEvents
    description: List Google Calendar events
    parameters:
      type: object
      properties:
        calendarId: { type: string, description: "Calendar ID (default primary)" }
        timeMin: { type: string, description: "RFC3339 lower bound" }
        timeMax: { type: string, description: "RFC3339 upper bound" }
        maxResults: { type: number }
      required: []
  - name: create_event
    function: createEvent
    description: Create a calendar event
    parameters:
      type: object
      properties:
        summary: { type: string }
        start: { type: string, description: "RFC3339 datetime" }
        end: { type: string, description: "RFC3339 datetime" }
        description: { type: string }
        location: { type: string }
      required: [summary, start, end]
  - name: update_event
    function: updateEvent
    description: Update a calendar event
    parameters:
      type: object
      properties:
        eventId: { type: string }
        summary: { type: string }
        start: { type: string }
        end: { type: string }
      required: [eventId]
  - name: delete_event
    function: deleteEvent
    description: Delete a calendar event
    parameters:
      type: object
      properties:
        eventId: { type: string }
      required: [eventId]
