<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="fathom" />
<meta name="mobile-web-app-capable" content="yes" />
<title>fathom</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<link rel="stylesheet" href="chat.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img class="brand-mark" src="icons/icon-192.png" alt="" width="22" height="22" />
      <span class="brand-name">fathom</span>
      <span class="topbar-divider">·</span>
      <span class="thread-title" id="thread-title">New chat</span>
    </div>
    <button class="topbar-menu" id="menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
  </div>
</header>

<main class="history" id="history" aria-live="polite"></main>

<form class="composer" id="composer" autocomplete="off">
  <textarea
    id="input"
    rows="1"
    placeholder="Ask anything…"
    inputmode="text"
    autocapitalize="sentences"
    autocomplete="off"
    autocorrect="on"
    spellcheck="true"
    enterkeyhint="send"></textarea>
  <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="4"/><polyline points="5,11 12,4 19,11"/></svg>
  </button>
</form>

<!-- Pairing / auth screen — shown when no device token is present -->
<div class="modal" id="auth-modal" hidden>
  <div class="modal-card">
    <h2>Pair this device</h2>
    <p class="modal-sub">
      Enter the 6-digit code from <code>fathom pair</code> in your terminal,
      or paste an API token from <code>~/.fantazm/api-token</code>.
    </p>
    <div class="modal-tabs" role="tablist">
      <button type="button" class="modal-tab is-active" data-tab="code" role="tab">Pairing code</button>
      <button type="button" class="modal-tab" data-tab="token" role="tab">API token</button>
    </div>
    <div class="modal-pane" data-pane="code">
      <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <input id="device-name-input" type="text" placeholder="Device name (optional)" autocomplete="off" />
      <button type="button" class="btn-primary" id="pair-btn">Pair</button>
    </div>
    <div class="modal-pane" data-pane="token" hidden>
      <input id="token-input" type="password" placeholder="Paste API token…" autocomplete="off" />
      <button type="button" class="btn-primary" id="token-btn">Connect</button>
    </div>
    <p class="modal-err" id="auth-err" hidden></p>
  </div>
</div>

<!-- Menu drawer -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="drawer-panel">
    <div class="drawer-header">
      <span>fathom</span>
      <button class="drawer-close" id="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <div class="drawer-body">
      <button class="drawer-item drawer-item-primary" id="new-session-btn">+ New chat</button>
      <div class="drawer-section-label">Conversations</div>
      <div class="thread-list" id="thread-list"></div>
      <a class="drawer-item drawer-item-quiet" id="settings-link" href="settings">Settings</a>
      <button class="drawer-item drawer-item-quiet" id="forget-device-btn">Forget this device</button>
      <div class="drawer-meta" id="drawer-meta"></div>
    </div>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
