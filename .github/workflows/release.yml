name: Release

# Tag a version (e.g. `git tag v0.2.0 && git push origin v0.2.0`) and this
# workflow builds darwin/linux × amd64/arm64 binaries via goreleaser,
# attaches them + a checksums.txt to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # cosign keyless signing (OIDC) — see the signs: block in .goreleaser.yml

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      # cosign must be on PATH before goreleaser runs — the signs: block
      # shells out to it to sign checksums.txt with the workflow's OIDC identity.
      - uses: sigstore/cosign-installer@v3
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
